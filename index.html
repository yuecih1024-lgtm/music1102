<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f2ea"><title>慢讀｜專注音樂與閱讀計時</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Serif+TC:wght@400;500;600;700&display=swap');
:root{--ink:#273a31;--muted:#78857b;--cream:#f5f2ea;--card:#fffefa;--green:#456b57;--sage:#dce5d9;--line:#e9e7dd;--orange:#c98759}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'DM Sans','Noto Serif TC',sans-serif;min-height:100vh}.wrap{max-width:1120px;margin:auto;padding:28px 32px 38px}.nav{height:48px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:700;letter-spacing:.16em;font-size:14px}.brand span{color:var(--orange)}.navright{font-size:12px;color:var(--muted);letter-spacing:.08em}.hero{padding:66px 0 35px;max-width:720px}.eyebrow{font-size:11px;letter-spacing:.2em;color:var(--orange);font-weight:700}.hero h1{font:500 clamp(34px,5vw,56px)/1.35 'Noto Serif TC',serif;letter-spacing:.08em;margin:13px 0 12px}.hero p{color:var(--muted);font-size:14px;letter-spacing:.04em;margin:0}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:27px;box-shadow:0 10px 35px #36453408}.cardhead{display:flex;align-items:center;justify-content:space-between}.label{font-size:11px;letter-spacing:.16em;color:var(--muted);font-weight:700}.live{font-size:10px;color:var(--green);background:#edf2e9;padding:7px 10px;border-radius:20px}.track{margin:27px 0 22px;display:flex;align-items:center;gap:16px}.cover{width:84px;height:84px;border-radius:15px;background:#d9dfcc url("reading-rain.png") center/cover;display:grid;place-items:center;font-size:28px;flex:none;box-shadow:0 5px 16px #34433520}.tracktitle{font:500 18px 'Noto Serif TC',serif;letter-spacing:.06em}.tracksub{font-size:12px;color:var(--muted);margin-top:6px}.controls{display:flex;align-items:center;gap:18px}.iconbtn{border:0;background:transparent;color:var(--muted);font-size:17px;cursor:pointer}.play{width:48px;height:48px;border:0;border-radius:50%;background:var(--green);color:white;font-size:18px;cursor:pointer;box-shadow:0 5px 14px #456b5733}.progress{margin:22px 0 7px;height:8px;padding:2px 0;cursor:pointer;touch-action:none;background:#e9e9df;border-radius:9px;overflow:hidden}.bar{height:4px;width:0%;background:var(--green);transition:width .3s}.times{display:flex;justify-content:space-between;font-size:10px;color:#9ba399}.soundrow{margin-top:25px;padding-top:20px;border-top:1px solid var(--line);display:flex;align-items:center;gap:11px}.soundicon{font-size:18px}.soundrow select{border:0;background:transparent;color:var(--ink);font:inherit;font-size:12px;outline:none}.volume{margin-left:auto;width:90px;accent-color:var(--green)}.timer{display:flex;flex-direction:column;align-items:center;padding:24px 0 5px}.ring{width:196px;height:196px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--green) 0deg,#e8e9df 0deg);position:relative}.ring:before{content:'';position:absolute;inset:9px;border-radius:50%;background:var(--card)}.clock{z-index:1;text-align:center}.clock strong{display:block;font:500 43px 'DM Sans',sans-serif;letter-spacing:.04em}.clock span{font-size:10px;letter-spacing:.17em;color:var(--muted)}.presets{display:flex;gap:8px;margin:20px 0 18px}.preset{border:1px solid var(--line);background:white;color:var(--muted);border-radius:20px;padding:8px 13px;font-size:11px;cursor:pointer}.preset.active{background:var(--sage);border-color:var(--sage);color:var(--green)}.timerbuttons{display:flex;gap:9px}.mainbtn,.resetbtn{border:0;border-radius:24px;padding:11px 25px;background:var(--green);color:white;letter-spacing:.08em;font-size:12px;cursor:pointer}.resetbtn{background:#f0efe8;color:var(--muted);padding-inline:17px}.quote{margin:20px 0 0;padding:20px 24px;border-radius:16px;background:#e9ede4;color:#647467;font:400 14px/1.9 'Noto Serif TC',serif;letter-spacing:.04em}.quote small{display:block;font:11px 'DM Sans',sans-serif;color:#99a295;margin-top:3px;letter-spacing:.1em}.footer{display:flex;justify-content:space-between;color:#9ba399;font-size:10px;letter-spacing:.1em;padding:25px 3px 0}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:var(--ink);color:white;border-radius:24px;padding:11px 18px;font-size:12px;opacity:0;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:720px){.wrap{padding:18px 18px 28px}.hero{padding:48px 0 26px}.cover{width:76px;height:76px}.grid{grid-template-columns:1fr}.card{padding:23px}.timer{padding-top:20px}.footer{gap:10px;flex-wrap:wrap}}
</style></head>
<body><main class="wrap"><nav class="nav"><div class="brand">慢讀<span>．</span> SLOWPAGE</div><div class="navright">A LITTLE SPACE FOR YOURSELF</div></nav>
<header class="hero"><div class="eyebrow">READ · BREATHE · FOCUS</div><h1>給自己一段，<br>安靜閱讀的時間。</h1><p>選一段喜歡的聲音，翻開書，慢慢進入自己的節奏。</p></header>
<section class="grid"><article class="card"><div class="cardhead"><div class="label">專注音樂</div><span class="live">● 現在播放</span></div><div class="track"><div class="cover">☁</div><div><div class="tracktitle" id="trackTitle">窗邊的雨</div><div class="tracksub" id="trackSub">雨聲與遠方的鋼琴 · 50 分鐘</div></div></div><div class="controls"><button class="iconbtn" id="prev" aria-label="上一首">↶</button><button class="play" id="play" aria-label="播放">▶</button><button class="iconbtn" id="next" aria-label="下一首">↻</button><span style="font-size:11px;color:var(--muted);margin-left:auto" id="state">準備好了嗎？</span></div><div class="progress" id="progress" role="slider" tabindex="0" aria-label="音樂播放進度" aria-valuemin="0" aria-valuemax="3000" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="times"><span id="elapsed">00:00</span><span>50:00</span></div><div class="soundrow"><span class="soundicon">♫</span><select id="sound" aria-label="選擇音景"><option value="rain">窗邊的雨</option><option value="forest">森林晨霧</option><option value="cafe">午後咖啡館</option></select><input class="volume" id="volume" type="range" min="0" max="100" value="35" aria-label="音量"></div></article>
<article class="card"><div class="cardhead"><div class="label">閱讀計時</div><span class="label" style="font-size:10px">POMODORO</span></div><div class="timer"><div class="ring" id="ring"><div class="clock"><strong id="clock">25:00</strong><span id="phase">專注時段</span></div></div><div class="presets"><button class="preset active" data-min="25">25 分鐘</button><button class="preset" data-min="45">45 分鐘</button><button class="preset" data-min="60">60 分鐘</button></div><div class="timerbuttons"><button class="mainbtn" id="start">開始閱讀</button><button class="resetbtn" id="reset">重設</button></div></div></article></section>
<aside class="quote">「讀書不必急著抵達哪裡，只要此刻，你和書頁在一起。」<small>今日的一句話 · TAKE YOUR TIME</small></aside><footer class="footer"><span>留一點空白，讓想法慢慢長出來。</span><span>MADE FOR QUIET MOMENTS · 2026</span></footer></main><div class="toast" id="toast"></div>
<script>
const tracks={rain:{title:'窗邊的雨',sub:'雨聲與柔和鋼琴氛圍',emoji:'☁',freq:220},forest:{title:'森林晨霧',sub:'鳥鳴、微風與清晨的光',emoji:'🌿',freq:330},cafe:{title:'午後咖啡館',sub:'溫暖咖啡館裡的輕音樂',emoji:'☕',freq:262}};let audioCtx,osc,gain,playing=false,musicSec=0,musicTimer=null,minutes=25,remaining=1500,timer=null,running=false;const $=id=>document.getElementById(id);function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}function audioStart(){audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();gain=audioCtx.createGain();gain.gain.value=+$('volume').value/100*.12;gain.connect(audioCtx.destination);const kind=$('sound').value,t=tracks[kind];if(kind==='rain'){const n=audioCtx.sampleRate*2,buf=audioCtx.createBuffer(1,n,audioCtx.sampleRate),d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;const noise=audioCtx.createBufferSource();noise.buffer=buf;noise.loop=true;const filter=audioCtx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=850;noise.connect(filter);filter.connect(gain);noise.start();osc=noise;return}osc=audioCtx.createOscillator();osc.type='sine';osc.frequency.value=t.freq;const lfo=audioCtx.createOscillator(),depth=audioCtx.createGain();lfo.frequency.value=.12;depth.gain.value=t.freq*.02;lfo.connect(depth);depth.connect(osc.frequency);lfo.start();osc.connect(gain);osc.start()}function setPlay(v){playing=v;$('play').textContent=v?'Ⅱ':'▶';$('state').textContent=v?'正在陪伴你':'準備好了嗎？';if(v){audioStart();musicTimer=setInterval(()=>{musicSec=(musicSec+1)%3000;$('elapsed').textContent=`${String(Math.floor(musicSec/60)).padStart(2,'0')}:${String(musicSec%60).padStart(2,'0')}`;$('bar').style.width=(musicSec/3000*100)+'%';$('progress').setAttribute('aria-valuenow',musicSec)},1000)}else{clearInterval(musicTimer);if(osc){osc.stop();osc.disconnect();osc=null}}}$('play').onclick=()=>setPlay(!playing);function seekMusic(clientX){const r=$('progress').getBoundingClientRect();musicSec=Math.max(0,Math.min(3000,Math.round((clientX-r.left)/r.width*3000)));$('bar').style.width=(musicSec/3000*100)+'%';$('elapsed').textContent=`${String(Math.floor(musicSec/60)).padStart(2,'0')}:${String(musicSec%60).padStart(2,'0')}`;$('progress').setAttribute('aria-valuenow',musicSec)}let seeking=false;$('progress').addEventListener('pointerdown',e=>{seeking=true;$('progress').setPointerCapture(e.pointerId);seekMusic(e.clientX)});$('progress').addEventListener('pointermove',e=>{if(seeking)seekMusic(e.clientX)});$('progress').addEventListener('pointerup',()=>seeking=false);$('progress').addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();musicSec=Math.max(0,Math.min(3000,musicSec+(e.key==='ArrowRight'?15:-15)));seekMusic($('progress').getBoundingClientRect().left+musicSec/3000*$('progress').getBoundingClientRect().width)}});$('sound').onchange=()=>{const t=tracks[$('sound').value];$('trackTitle').textContent=t.title;$('trackSub').textContent=t.sub;document.querySelector('.cover').textContent='';document.querySelector('.cover').style.backgroundImage=`url('${t.cover}')`;if(playing){setPlay(false);setPlay(true)}};$('volume').oninput=()=>{if(gain)gain.gain.value=+$('volume').value/100*.035};$('prev').onclick=()=>toast('已回到這段音景的開頭');$('next').onclick=()=>{const s=$('sound'),i=(s.selectedIndex+1)%s.options.length;s.selectedIndex=i;s.dispatchEvent(new Event('change'))};function draw(){const m=Math.floor(remaining/60),s=remaining%60;$('clock').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;const angle=(1-remaining/(minutes*60))*360;$('ring').style.background=`conic-gradient(var(--green) ${angle}deg,#e8e9df ${angle}deg)`}document.querySelectorAll('.preset').forEach(b=>b.onclick=()=>{if(running)return;document.querySelectorAll('.preset').forEach(x=>x.classList.remove('active'));b.classList.add('active');minutes=+b.dataset.min;remaining=minutes*60;draw()});$('start').onclick=()=>{if(running){clearInterval(timer);running=false;$('start').textContent='繼續閱讀';$('phase').textContent='已暫停';return}running=true;$('start').textContent='暫停';$('phase').textContent='專注時段';timer=setInterval(()=>{if(remaining>0){remaining--;draw()}else{clearInterval(timer);running=false;$('start').textContent='再讀一回';$('phase').textContent='完成一段';toast('太好了，完成一段專注閱讀！');if('Notification'in window&&Notification.permission==='granted')new Notification('慢讀｜專注完成',{body:'太好了，完成一段專注閱讀！'})}},1000)};$('reset').onclick=()=>{clearInterval(timer);running=false;remaining=minutes*60;$('start').textContent='開始閱讀';$('phase').textContent='專注時段';draw()};document.querySelector('.cover').style.backgroundImage=`url('${tracks[$('sound').value].cover}')`;draw();
</script></body></html>
